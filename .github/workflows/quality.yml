name: Quality

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run audit:all
      - name: Run npm run check:release
        run: |
          New-Item -ItemType Directory -Force -Path logs | Out-Null
          npm run check:release 2>&1 | Tee-Object -FilePath logs/release-check.log
          exit $LASTEXITCODE
        env:
          CARD_VAULT_UI_SCREENSHOT_MODE: compare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: card-vault-release-check-${{ github.sha }}
          path: |
            logs/release-check.log
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7
