name: Windows release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:win
      - run: npm run verify:release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: card-vault-windows-${{ github.sha }}
          path: |
            dist/card-vault-*-setup.exe
            dist/card-vault-*-portable.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
